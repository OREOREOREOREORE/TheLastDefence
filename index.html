<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Last Defense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

  <body>
    <div id="game-container" class="hidden">
      <p id="time-remaining-label">Time Remaining: <span id="time-remaining"></span></p>
    </div>
    <div id="home-container" class="flex flex-column">
      <form id="login-form" class="form flex flex-column" autocomplete="off">
        <h1>Login</h1>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="username"
          class="input"
        />
        <input
          type="password"
          id="pwd"
          name="password"
          placeholder="password"
          class="input"
        />
        <button type="submit" id="login-btn" class="btn">Let's start</button>
        <div>
          <p>Don't have an account? <a href="#" id="register-link">register</a></p>
        </div>
        <p class="message"></p>
      </form>
      <form id="register-form" class="form hidden flex-column" autocomplete="off">
        <h1>Registration</h1>
        <input
          type="text"
          id="reg-username"
          name="username"
          placeholder="Username"
          class="input"
        />
        <input
          type="password"
          id="reg-pwd"
          name="password"
          placeholder="Password"
          class="input"
        />
        <input
          type="password"
          id="ver-pwd"
          name="Verify Password"
          placeholder="Verify password"
          class="input"
        />
        <button type="submit" id="reg-btn" class="btn">Register</button>
        <p>Already have an account?<a href="#" id="login-link">Login</a></p>
        <p class="message"></p>
      </form>
      <div id="start-menu" class="hidden flex-column">
        <button id="btn-start" class="btn">Start</button>
        <button id="btn-about" class="btn">About</button>
        <button id="btn-logout" class="btn">Logout</button>
      </div>
      <div id="about-container" class="hidden flex-column">
        <h1>About & How to play</h1>
        <p>Something...</p>
        <button id="btn-back-to-start-menu" class="btn">Back to Start Menu</button>
      </div>
    </div>
    <div id="game-room-container" class="hidden flex-column">
      <p id="room-number-text">Room <span id="room-number">#</span></p>
      <div id="players-container" class="flex">
        <div class="player-info flex flex-column">
          <img src="asset/player1-avatar.png" alt="player1" class="player-avatar">
          <label id="player1-label"></label>
        </div>
        <div class="player-info flex flex-column">
          <img src="asset/player2-avatar.png" alt="player2" class="player-avatar">
          <label id="player2-label"></label>
        </div>
      </div>
      <button id="ready-button" class="btn">I'm Ready!</button>
      <button id="leave-room-button" class="btn">Leave this room</button>
    </div>
